name: Welcome Contributor

# Two triggers:
# 1. First-time PR/issue opened -> generic welcome + star ask.
# 2. Someone gets assigned to an issue -> assignment-specific welcome.
#    Fires every time an assignment happens (not just first-time contributors),
#    since assignment is a distinct, deliberate action.

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened, assigned]

permissions:
  pull-requests: write
  issues: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const isPR = !!context.payload.pull_request;
            const isAssignment = context.payload.action === 'assigned';
            const payload = isPR ? context.payload.pull_request : context.payload.issue;
            const number = payload.number;

            let body;

            if (isAssignment) {
              const assignee = context.payload.assignee?.login;
              if (!assignee) return; // safety guard, shouldn't happen on 'assigned' events

              body = [
                `You're assigned! Welcome, and thanks for picking this up, @${assignee}.`,
                ``,
                `A couple of things before you start:`,
                `- Please follow the [contributing guidelines](../blob/main/CONTRIBUTING.md) and fill out the PR template fully (description, verification, checklist) when you open your PR.`,
                `- If you find the project useful, a ⭐ on the repo helps a lot — thanks for supporting us!`,
                ``,
                `Let me know if you have any questions about the codebase or the acceptance criteria.`,
              ].join('\n');
            } else {
              // first-time opener path (original behavior)
              const association = payload.author_association;
              const firstTimeAssociations = ['FIRST_TIME_CONTRIBUTOR', 'FIRST_TIMER', 'NONE'];
              if (!firstTimeAssociations.includes(association)) return;

              body = [
                `Welcome, and thanks for opening this ${isPR ? 'pull request' : 'issue'}! 🎉`,
                ``,
                `Please make sure your contribution follows our [contributing guidelines](../blob/main/CONTRIBUTING.md) before review.`,
                ``,
                `If you find the project useful, a ⭐ on the repo helps a lot — thanks for supporting us!`,
              ].join('\n');
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body,
            });
