name: Comment on Failing Checks

# Posts a comment on the PR listing which checks failed, once per suite.
# Skips if it already left the same comment (avoids duplicate spam on re-runs).

on:
  check_suite:
    types: [completed]

permissions:
  pull-requests: write
  checks: read
  contents: read

jobs:
  comment-failures:
    if: github.event.check_suite.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Find PR and comment failing checks
        uses: actions/github-script@v9
        with:
          script: |
            const suite = context.payload.check_suite;
            const prs = suite.pull_requests;
            if (!prs.length) return;

            const { data: checkRuns } = await github.rest.checks.listForSuite({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_suite_id: suite.id,
            });

            const failed = checkRuns.check_runs.filter(r => r.conclusion === 'failure');
            if (!failed.length) return;

            const marker = '<!-- failing-checks-bot -->';
            const list = failed.map(r => `- [${r.name}](${r.html_url}) — failed`).join('\n');

            for (const pr of prs) {
              const body = [
                marker,
                `⚠️ **Some checks are failing on this PR:**`,
                ``,
                list,
                ``,
                `Please review the logs and push a fix. Ping a maintainer if you're stuck.`,
              ].join('\n');

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, per_page: 100,
              });

              const existing = comments.find(c => c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, body,
                });
              }
            }
