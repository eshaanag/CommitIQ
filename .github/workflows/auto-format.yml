name: Auto Format

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install formatter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install black ruff

      - name: Run Black formatter
        run: black --config pyproject.toml backend/

      - name: Run Ruff autofixes
        run: ruff check --config pyproject.toml --fix backend/ || true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Run Prettier
        run: npx prettier --config frontend/.prettierrc --write --ignore-unknown "frontend/src/**/*.{ts,tsx,js,jsx,css}" "frontend/public/**/*"

      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-format code on PR branch"
